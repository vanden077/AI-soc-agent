x-redis-creds: &redis-creds
  REDIS_USERNAME: "default"
  REDIS_PASSWORD: "uAknMMvZDYm7HhhaWPp3" # <= I know, should be in a vault etc ... it's just a PoC

services:
  web:
    build:
      context: ./
      dockerfile: ./dev.dockerfile
    container_name: cyber-agent-api
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      <<: *redis-creds
      ENV: "development"
      MITRE_STIX_URL: "https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack-"
      MITRE_JSON_PATH: "data/mitre/enterprise-attack.json"
      MITRE_INDEX_SCHEMA_PATH: "data/index_schemas/mitre_index_schema.yaml"
      MITRE_SEMANTIC_HASHES_KEY: "mitre:persistence:semantic_hashes"
      MITRE_RELEASE_TAG: "19.2"
      PERSISTENCE_ENGINE: "redis"
      REDIS_HOST: "cyber-agent-redis"
      REDIS_PORT: 6379
      REDIS_JSON_POOL_SIZE: 5
      REDIS_VECTOR_POOL_SIZE: 20
      REDIS_RETRY_STRATEGY: 3
      REDIS_SSL: "False"
      REDIS_VL_INDEX_NAME: "mitre_attack_v1"
      REDIS_VL_VECTOR_FIELD: "technique_vector"
      REDIS_VECTOR_POOL_DB_ID: 0
      REDIS_JSON_POOL_DB_ID: 1
      EMBEDDING_ENGINE: "huggingface"
      EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
      EMBEDDING_DIMENSION: 384
      LLM_ENGINE: "ollama"
      LLM_MODEL: "phi4-mini:3.8b" # because of my laptop without GPU :(
      LLM_URL: "http://cyber-agent-ollama:11434"
      LLM_TEMPERATURE: 0.0
    command: uv run fastapi dev src/main.py --host 0.0.0.0 --port 8080
    depends_on:
      redis:
        condition: service_started
      ollama-puller:
        condition: service_completed_successfully
    networks:
      - cyber-agent-network


  # --- LLM Local engine ---
  cyber-agent-ollama:
    image: ollama/ollama:latest
    container_name: cyber-agent-ollama
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: "10m"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    entrypoint: ["sh", "-c", "ollama serve >/dev/null 2>&1"]
    restart: unless-stopped
    networks:
      - cyber-agent-network

  ollama-puller:
    image: curlimages/curl:latest
    container_name: ollama-puller
    depends_on:
      - cyber-agent-ollama
    entrypoint: >
      sh -c "
      echo '🚀 Waiting for Ollama socket...';
      until curl -s -f http://cyber-agent-ollama:11434/api/tags > /dev/null; do sleep 2; done;
      echo '📦 Ollama online. Pulling phi4-mini:3.8b...';
      curl -s -f -N -X POST http://cyber-agent-ollama:11434/api/pull -d '{\"name\": \"phi4-mini:3.8b\"}' > /dev/null;
      echo '🎯 Model successfully cached!';"
    networks:
      - cyber-agent-network


  # --- Cache | Checkpoint | Vector database ---
  redis:
    image: redis/redis-stack-server:latest
    container_name: cyber-agent-redis
    environment:
      <<: *redis-creds
      REDIS_ARGS: "--save 60 1 --appendonly yes"
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - redis-cyber-data:/data
    restart: always
    networks:
      - cyber-agent-network

volumes:
  ollama-data: { }
  redis-cyber-data: { }

networks:
  cyber-agent-network:
    driver: bridge
