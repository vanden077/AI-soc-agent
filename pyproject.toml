[project]
name = "soc-agent"
version = "0.1.0"
description = "AI Soc analyst performing MITRE correlations."
readme = "README.md"
authors = [
    { name = "Clément Pichet", email = "vanden.077@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "langchain-ollama>=1.1.0",
    "langgraph==1.2.12",
    "pydantic>=2.13.5",
    "redis[hiredis]==8.1.0",
    "torch",
    "langchain-redis==0.2.6",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers==6.1.0",
    "ruff==0.16.9",
    "langchain-core==1.6.5",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "fakeredis[json]"
]

[tool.ruff]
src = ["src"]
