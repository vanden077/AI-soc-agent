[project]
name = "soc-agent"
version = "0.1.0"
description = "AI Soc analyst performing MITRE correlations."
readme = "README.md"
authors = [
    { name = "vanden077", email = "151510724+vanden077@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "langchain-ollama>=1.1.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "redis[hiredis]>=5.2.0",
    "redisvl==0.27.2", # Pinned: upstream releases introduce frequent breaking schema changes
    "ijson>=3.6.0",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "fakeredis[json]",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["BLE001", "SIM103"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
