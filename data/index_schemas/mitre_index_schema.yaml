# RedisVL index search configuration for MITRE ATT&CK
index:
  name: "mitre_attack_v1"       # search index name
  prefix: "mitre:technique"     # prefix added before each unique identifier (mitre:technique:T1055)
  storage_type: "hash"          # storage type "hash" or "json"

fields:
  - name: "mitre_id"
    type: "tag"
  - name: "parent_id"
    type: "tag"
  - name: "technic_name"
    type: "text"
  - name: "description"
    type: "text"
  - name: "compiled_text"
    type: "text"
  - name: "semantic_hash"
    type: "tag"
  - name: "platforms"           # platforms is a tag with separator because we want an exact match from a list
    type: "tag"
    attrs:
      separator: ","
      case_sensitive: false
  - name: "tactics"
    type: "text"

  - name: "technique_vector"    # The exact name of your embedding column partition
    type: "vector"
    attrs:
      dims: 384
      distance_metric: "cosine"
      algorithm: "hnsw"
      datatype: "float32"